# Serves the Angular app and forwards API and SignalR traffic to the API container,
# so the browser only talks to one address.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# HTTPS ends at Caddy on the server, which says so in X-Forwarded-Proto.
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

server {
    listen 8080;

    # On the server, Caddy is in front and sends the visitor's address in X-Forwarded-For.
    # Trusting private addresses works because only Caddy, or Docker's port forwarding on
    # your own machine, can reach this container.
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header X-Forwarded-For;
    root /usr/share/nginx/html;

    # Docker's DNS. Looking the name up per request means restarting the API doesn't break the proxy.
    resolver 127.0.0.11 valid=10s;
    set $api http://api:8080;

    # Slightly above the API's own 5 MB limit, so that it can answer with a readable error.
    client_max_body_size 6m;

    # Sends a single address, the visitor's, since the login rate limit relies on it.
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
    # For SignalR's WebSocket connection.
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;

    location /api/ {
        proxy_pass $api;
    }

    location /chatHub {
        proxy_pass $api;
        # SignalR puts the access token in the query string; keep it out of the logs.
        access_log off;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
