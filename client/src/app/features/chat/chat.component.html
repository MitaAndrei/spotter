<div class="chat-layout">
  <!-- Sidebar -->
  <aside class="conversations-panel">
    <div class="panel-header">
      <div class="header-title">
        <mat-icon class="title-icon">forum</mat-icon>
        <h2>Chats</h2>
      </div>
    </div>

    <div class="conversations-list">
      @for(friend of friends; track friend.username){
        <a [routerLink]="friend.username" [state]="friend" (click)="selectUser(friend)" class="conversation-link">
          <div class="conversation-card" [class.selected]="this.selectedUserSig()?.id === friend.id">
            <div class="avatar-wrapper">
              <img [src]="friend.profileImageUrl || 'assets/default-avatar.svg'" alt="{{friend.username}}" class="avatar">
            </div>
            <div class="conversation-content">
              <div class="conversation-header">
                <span class="contact-name">{{friend.username}}</span>
              </div>
            </div>
          </div>
        </a>
      }
    </div>
  </aside>

  <!-- Main Content -->
  <main class="chat-content">
    <router-outlet></router-outlet>
  </main>
</div>
