# Deploys the live demo to the server after CI passes on main. See docs/deploy-vps.md for the setup.
name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

# One deployment at a time; a newer one waits instead of cancelling a deployment halfway.
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Build images and deploy
    # Skipped until the server setup in docs/deploy-vps.md is done.
    if: vars.VPS_HOST != '' && (github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    env:
      SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SHA }}

      # Image names on ghcr.io must be lowercase.
      - run: echo "IMAGE_PREFIX=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: api/gymappAPI
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}/api:${{ env.SHA }}
            ${{ env.IMAGE_PREFIX }}/api:latest

      - uses: docker/build-push-action@v6
        with:
          context: client
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}/client:${{ env.SHA }}
            ${{ env.IMAGE_PREFIX }}/client:latest

      - name: Set up SSH
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519

      - name: Copy the compose files
        run: >
          scp docker-compose.yml docker-compose.prod.yml Caddyfile
          "${{ vars.VPS_USER }}@${{ vars.VPS_HOST }}:~/gymapp/"

      # The job's token can read the private images, and only works while this job runs.
      # It goes in on stdin, so it doesn't show up in the server's process list.
      - name: Pull the new images and restart
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "$TOKEN" | ssh "${{ vars.VPS_USER }}@${{ vars.VPS_HOST }}" "
            set -e
            cd ~/gymapp
            docker login ghcr.io -u '${{ github.actor }}' --password-stdin
            export IMAGE_PREFIX='$IMAGE_PREFIX' IMAGE_TAG='$SHA'
            docker compose -f docker-compose.yml -f docker-compose.prod.yml pull api client
            docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --no-build --remove-orphans
            # Saved after a successful start, so commands run by hand on the server use the same images.
            sed -i '/^IMAGE_TAG=/d' .env
            echo 'IMAGE_TAG=$SHA' >> .env
            docker logout ghcr.io
            docker image prune -af
          "
